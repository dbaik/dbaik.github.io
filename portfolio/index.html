<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senior WordPress & Shopify Developer | Dmitry Bashkatov</title>
    <meta name="description" content="Senior WordPress & Shopify developer. I help agencies and product teams turn approved designs into reliable production sites." />
    <meta name="color-scheme" content="light dark" />
    <script>
      {
        const colorScheme = localStorage.getItem('color-scheme');
        if (colorScheme === 'light' || colorScheme === 'dark') {
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', colorScheme);
          document.documentElement.classList.add('scheme-' + colorScheme);
        }
      }
    </script>
    <style>
      html, body { background: #070b15; color: #f1f5f9; }
      html.scheme-light, html.scheme-light body { background: #f3f5fb; color: #0f172a; }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body class="bg-[#070b15] text-slate-100 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
