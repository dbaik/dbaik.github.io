<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#050510">
  <title></title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="bg-icons" id="bgIcons" aria-hidden="true"></div>
  <div class="legendary-stage" id="legendaryStage" aria-hidden="true"></div>
  <div class="page-shell">
    <div class="top-controls" id="topControls" role="group" aria-label="Theme, language, and sound controls">
      <button class="control-toggle control-toggle--theme" id="themeToggle" type="button" aria-pressed="false">
        <span class="control-toggle__icon" id="themeToggleIcon" aria-hidden="true">☾</span>
        <span class="control-toggle__sr" id="themeToggleLabel">Dark</span>
      </button>
      <button class="control-toggle control-toggle--lang" id="languageToggle" type="button" aria-pressed="false">
        <span class="control-toggle__icon" id="languageToggleIcon" aria-hidden="true">EN</span>
        <span class="control-toggle__sr" id="languageToggleLabel">RU</span>
      </button>
      <button class="control-toggle control-toggle--sound is-muted" id="soundToggle" type="button" aria-pressed="false">
        <span class="control-toggle__icon" id="soundToggleIcon" aria-hidden="true">🔇</span>
        <span class="control-toggle__sr" id="soundToggleLabel">Off</span>
      </button>
    </div>
    <main class="card">
      <header class="card-header">
        <h1 class="card-title" id="cardTitle"></h1>
      </header>

      <section class="card-content">
        <div class="card-left">
          <button class="egg-counter" id="eggCounter" type="button" aria-label="Show hidden interactions hint">
            <span class="egg-counter__label" id="eggCounterLabel"></span>
            <span class="egg-counter__value" id="eggCounterValue"></span>
            <!-- <span class="egg-counter__hint">на клаве: frontend / birthday / coffee</span> -->
          </button>

          <article class="profile-card">
            <div class="profile-top">
              <span class="terminal-icon">&gt;_</span>
              <span id="profileTopTitle"></span>
            </div>

            <div class="profile-crown" aria-hidden="true">👑</div>

            <button class="profile-image-frame profile-image-button" type="button" data-easter="portrait"
              aria-label="Poke the birthday portrait">
              <img src="assets/profile.png" alt="Dev profile" class="profile-image">
            </button>

            <div class="profile-bottom">
              <div class="profile-meta">
                <div><span id="profileRoleLabel"></span> <span id="profileRoleValue"></span></div>
                <div><span id="profileStackLabel"></span> <span id="profileStackValue"></span></div>
                <div><span id="profileCodingSinceLabel"></span> <span id="profileCodingSinceValue"></span></div>
              </div>

              <button class="profile-trophy profile-action" type="button" data-easter="achievement"
                aria-label="Unlock achievement">🏆</button>
            </div>
          </article>

          <button class="code-title code-title-action" type="button" data-easter="deploy"
            aria-label="Deploy birthday script">
            <span class="code-badge" id="codeBadgeLabel"></span>
            <span id="codeTitleLabel"></span>
          </button>
        </div>

        <div class="card-right">
          <div class="birthday-title">
            <span id="birthdayTitleText"></span><br>
            <span class="birthday-accent" id="birthdayTitleAccent"></span>
          </div>

          <p class="birthday-subtext" id="birthdaySubtext"></p>

          <div class="command-panel" id="commandPanel" aria-labelledby="commandPanelTitle" aria-expanded="false">
            <div class="command-panel__window">
              <div class="command-panel__header">
                <span id="commandPanelTitle"></span>
              </div>
              <div class="command-panel__body" id="commandPanelBody" aria-hidden="true" inert>
                <div class="command-panel__log" id="commandLog" aria-live="polite"></div>
                <label class="command-panel__line">
                  <span>$</span>
                  <input id="commandInput" type="text" autocomplete="off" spellcheck="false" tabindex="-1"
                    aria-label="Secret command input">
                </label>
              </div>
            </div>
          </div>

        </div>
      </section>

      <footer class="card-footer">
        <button class="footer-icon footer-action" type="button" data-easter="cake" aria-label="Cake celebration">
          <big>🎂</big>
        </button>
        <span class="footer-line"></span>
        <span class="footer-txt" id="footerCopy"></span>
        <span class="footer-line"></span>
        <button class="footer-icon footer-action" type="button" data-easter="terminal"
          aria-label="Focus secret terminal">&lt;/&gt;</button>
        <button class="footer-icon footer-action" type="button" data-easter="share"
          aria-label="Share birthday protocol"><big>↗</big></button>
      </footer>

      <div class="scanlines"></div>
      <div class="particles" id="particles"></div>
    </main>
  </div>

  <div class="cursor-fx" id="cursorFx" aria-hidden="true">
    <div class="cursor-comet" id="cursorComet"></div>
  </div>

  <div class="mobile-intro" id="mobileIntro" role="dialog" aria-modal="true" aria-labelledby="mobileIntroTitle"
    aria-describedby="mobileIntroText" aria-hidden="true">
    <div class="mobile-intro__panel">
      <div class="mobile-intro__eyebrow" id="mobileIntroEyebrow"></div>
      <h2 class="mobile-intro__title" id="mobileIntroTitle"></h2>
      <p class="mobile-intro__text" id="mobileIntroText"></p>
      <div class="mobile-intro__actions">
        <button class="mobile-intro__close" type="button" id="mobileIntroClose"></button>
      </div>
    </div>
  </div>

  <div class="secret-modal" id="secretModal" role="dialog" aria-modal="true" aria-labelledby="secretModalTitle"
    aria-hidden="true">
    <div class="secret-modal__panel">
      <button class="secret-modal__close" type="button" data-close-secret aria-label="Close dialog">×</button>
      <div class="secret-modal__eyebrow" id="secretModalEyebrow"></div>
      <h2 class="secret-modal__title" id="secretModalTitle"></h2>
      <p class="secret-modal__text" id="secretModalText"></p>
      <div class="secret-modal__progress" id="secretModalProgress"></div>
      <button class="secret-modal__restart" id="secretModalRestart" type="button"></button>
    </div>
  </div>

  <div class="code-modal" id="codeModal" role="dialog" aria-modal="true" aria-labelledby="codeModalTitle"
    aria-hidden="true">
    <div class="code-modal__panel">
      <div class="code-modal__head">
        <h2 class="code-modal__title" id="codeModalTitle"></h2>
        <button class="code-modal__close" type="button" data-close-code aria-label="Close code view">×</button>
      </div>
      <div class="code-live is-hidden" id="birthdayCodeLive" aria-live="polite" aria-label="Birthday code output">
      </div>
    </div>
  </div>

  <div class="audio-modal" id="audioModal" role="dialog" aria-modal="true" aria-labelledby="audioModalTitle"
    aria-describedby="audioModalText" aria-hidden="true">
    <div class="audio-modal__panel">
      <button class="secret-modal__close audio-modal__close" type="button" id="audioModalClose"
        aria-label="Close dialog">×</button>
      <div class="audio-modal__eyebrow" id="audioModalEyebrow"></div>
      <h2 class="audio-modal__title" id="audioModalTitle"></h2>
      <p class="audio-modal__text" id="audioModalText"></p>
      <div class="audio-modal__actions">
        <button class="audio-modal__confirm" type="button" id="audioModalConfirm"></button>
        <button class="audio-modal__cancel" type="button" id="audioModalCancel"></button>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>

</html>
